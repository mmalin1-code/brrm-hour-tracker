<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BRRM Hours Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: #F5F4F0; padding: 1rem; font-size: 14px; }
input, select, textarea, button { font-family: Georgia, serif; }

.hdr { max-width: 980px; margin: 0 auto 1rem; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.hdr-left h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: #111; display: inline; }
.hdr-left span { font-size: 12px; color: #888; letter-spacing: 0.12em; text-transform: uppercase; margin-left: 8px; }
.hdr-stats { font-size: 13px; color: #555; margin-top: 4px; }
.hdr-stats strong { color: #111; }

.week-nav { display: flex; align-items: center; gap: 10px; }
.week-nav button { background: #fff; border: 1px solid #ddd; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; color: #111; }
.week-nav button:hover { background: #f0f0f0; }
.week-label { font-size: 14px; font-weight: 600; color: #111; min-width: 170px; text-align: center; }

.cal-wrap { max-width: 980px; margin: 0 auto; overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; min-width: 700px; }
.cal-col { background: #fff; border-radius: 14px; border: 1px solid #E5E5E0; overflow: hidden; }
.cal-day-hdr { padding: 10px 10px 8px; border-bottom: 1px solid #F0F0EC; }
.cal-day-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #888; }
.cal-day-date { font-size: 18px; font-weight: 700; color: #111; margin-top: 2px; }
.cal-day-hdr.today { background: #111; }
.cal-day-hdr.today .cal-day-name { color: #aaa; }
.cal-day-hdr.today .cal-day-date { color: #fff; }

.cal-entries { padding: 8px; min-height: 80px; }
.entry-chip { border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 11px; position: relative; }
.entry-chip .chip-title { font-weight: 700; color: #111; margin-bottom: 1px; padding-right: 18px; }
.entry-chip .chip-time { color: #666; }
.entry-chip .chip-pay { font-weight: 700; margin-top: 2px; }
.chip-check { position: absolute; top: 6px; right: 6px; width: 13px; height: 13px; accent-color: #059669; cursor: pointer; }
.chip-actions { display: none; position: absolute; bottom: 5px; right: 4px; gap: 4px; }
.entry-chip:hover .chip-actions { display: flex; }
.chip-del, .chip-edit { background: none; border: none; font-size: 13px; color: #bbb; cursor: pointer; padding: 1px 3px; line-height: 1; border-radius: 4px; }
.chip-del:hover { color: #E24B4A; background: rgba(226,75,74,0.08); }
.chip-edit:hover { color: #555; background: rgba(0,0,0,0.06); }

.chip-A { background: #DBEAFE; border: 1px solid #BFDBFE; }
.chip-A .chip-pay { color: #1E40AF; }
.chip-B { background: #FEF3C7; border: 1px solid #FDE68A; }
.chip-B .chip-pay { color: #92400E; }
.chip-O { background: #D1FAE5; border: 1px solid #A7F3D0; }
.chip-O .chip-pay { color: #065F46; }
.chip-C { background: #EDE9FE; border: 1px solid #DDD6FE; }
.chip-C .chip-pay { color: #5B21B6; }

.add-chip { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 7px; background: none; border: 1px dashed #ddd; border-radius: 8px; font-size: 12px; color: #aaa; cursor: pointer; font-family: Georgia, serif; margin-top: 2px; }
.add-chip:hover { border-color: #999; color: #555; background: #fafafa; }

/* Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 18px; padding: 1.5rem; width: 360px; max-width: 95vw; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
.modal h3 { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 14px; }
.modal label { display: block; font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; margin-top: 10px; }
.modal select, .modal input[type="time"], .modal input[type="text"], .modal textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #E5E5E0; border-radius: 10px; font-size: 14px; color: #111; background: #fff; font-family: Georgia, serif;
}
.modal textarea { resize: vertical; min-height: 60px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.btn-save { flex: 1; padding: 11px; background: #111; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: Georgia, serif; }
.btn-save:hover { opacity: 0.85; }
.btn-cancel { padding: 11px 16px; background: #fff; color: #666; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; cursor: pointer; font-family: Georgia, serif; }
.btn-cancel:hover { background: #f5f5f5; }
.err { color: #E24B4A; font-size: 12px; margin-top: 6px; min-height: 16px; }

/* Bottom */
.bottom { max-width: 980px; margin: 12px auto 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sum-card { background: #fff; border-radius: 12px; border: 1px solid #E5E5E0; padding: 12px 14px; }
.sum-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.sum-val { font-size: 20px; font-weight: 700; color: #111; }

/* Rates */
.rates-bar { max-width: 980px; margin: 10px auto 0; background: #fff; border-radius: 12px; border: 1px solid #E5E5E0; padding: 12px 16px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.rates-bar > span { font-size: 12px; color: #888; }
.rates-bar label { font-size: 12px; color: #555; display: inline-flex; align-items: center; gap: 4px; }
.rates-bar input { width: 60px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: Georgia, serif; }

/* Office submit */
.office-submit-bar { max-width: 980px; margin: 10px auto 0; background: #fff; border-radius: 12px; border: 1px solid #E5E5E0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.office-submit-bar p { font-size: 13px; color: #555; }
.office-submit-bar p strong { color: #111; }
.btn-submit-week { padding: 9px 18px; background: #111; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: Georgia, serif; }
.btn-submit-week.done { background: #059669; }
.btn-submit-week.done:hover { background: #047857; }

@media (max-width: 600px) {
  .bottom { grid-template-columns: 1fr 1fr; }
  .rates-bar { gap: 12px; }
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
      <img id="brrm-logo" src="" alt="" style="height:40px;display:none;border-radius:6px;" />
      <div>
        <h1>BRRM</h1><span>Hours Tracker</span>
      </div>
    </div>
    <div class="hdr-stats" id="hdr-stats">Weekly pay: <strong>$0.00</strong> · Office hrs: <strong>0.00</strong> · Entries: <strong>0</strong></div>
  </div>
  <div class="week-nav">
    <button onclick="changeWeek(-1)">‹</button>
    <div class="week-label" id="week-label">—</div>
    <button onclick="changeWeek(1)">›</button>
  </div>
</div>

<div class="cal-wrap">
  <div class="cal" id="cal"></div>
</div>

<div class="bottom">
  <div class="sum-card"><div class="sum-label">Weekly pay</div><div class="sum-val" id="s-pay">$0.00</div></div>
  <div class="sum-card"><div class="sum-label">Total hours</div><div class="sum-val" id="s-hrs">0.00h</div></div>
  <div class="sum-card"><div class="sum-label">Office hours</div><div class="sum-val" id="s-off">0.00h</div></div>
  <div class="sum-card"><div class="sum-label">Entries</div><div class="sum-val" id="s-count">0</div></div>
</div>

<div class="rates-bar">
  <span>Hourly rates:</span>
  <label>B Timer $<input type="number" id="rate-B Timer" value="25" onchange="saveRates();render();" /></label>
  <label>Office Hours $<input type="number" id="rate-Office Hours" value="20" onchange="saveRates();render();" /></label>
  <label>Custom $<input type="number" id="rate-Custom" value="20" onchange="saveRates();render();" /></label>
  <span style="color:#ccc;">· A Timer = $300 flat</span>
</div>

<div class="office-submit-bar">
  <p id="office-summary-text">Office hours this week: <strong>0.00 hrs</strong> · Pay: <strong>$0.00</strong></p>
  <button class="btn-submit-week" id="office-btn" onclick="submitWeek()">Submit Office Hours</button>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Add Entry</h3>
    <label>Job type</label>
    <select id="m-job" onchange="toggleCustom()">
      <option>A Timer</option><option>B Timer</option><option>Office Hours</option><option>Custom</option>
    </select>
    <div id="customWrap" style="display:none">
      <label>Custom title</label>
      <input type="text" id="m-custom" placeholder="Job title" />
    </div>
    <div class="row2">
      <div><label>Start</label><input type="time" id="m-start" /></div>
      <div><label>End</label><input type="time" id="m-end" /></div>
    </div>
    <label>Notes</label>
    <textarea id="m-notes" placeholder="What did you work on?"></textarea>
    <div class="err" id="m-err"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Add Hours</button>
    </div>
  </div>
</div>

<script>
var DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var FULL_DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var CHIP = { "A Timer":"chip-A","B Timer":"chip-B","Office Hours":"chip-O","Custom":"chip-C" };

var weekOffset = 0;
var activeDay = null;
var editingId = null;

// Load from localStorage
var entries = JSON.parse(localStorage.getItem("brrm_entries") || "[]");
var officeSubmitted = JSON.parse(localStorage.getItem("brrm_office_submitted") || "{}");
var rates = JSON.parse(localStorage.getItem("brrm_rates") || '{"B Timer":25,"Office Hours":20,"Custom":20}');

// Apply saved rates to inputs on load
window.addEventListener("DOMContentLoaded", function() {
  Object.keys(rates).forEach(function(k) {
    var el = document.getElementById("rate-"+k);
    if (el) el.value = rates[k];
  });
  render();
});

function saveRates() {
  rates = {
    "B Timer": Number(document.getElementById("rate-B Timer").value),
    "Office Hours": Number(document.getElementById("rate-Office Hours").value),
    "Custom": Number(document.getElementById("rate-Custom").value),
  };
  localStorage.setItem("brrm_rates", JSON.stringify(rates));
}

function saveEntries() {
  localStorage.setItem("brrm_entries", JSON.stringify(entries));
}

function getWeekDates(offset) {
  var now = new Date();
  var dow = now.getDay();
  var monday = new Date(now);
  monday.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
  monday.setHours(0,0,0,0);
  var dates = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function fmtDate(d) {
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+d.getDate();
}

function isToday(d) {
  var n = new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}

function changeWeek(dir) { weekOffset += dir; render(); }

function getRate(job) { return rates[job] || 20; }

function calcPay(e) {
  if (e.job==="A Timer") return 300;
  return e.hours * getRate(e.job);
}

function toMins(t) { var p=t.split(":").map(Number); return p[0]*60+p[1]; }

function fmt(t) {
  var p=t.split(":").map(Number); var h=p[0], m=p[1];
  return (h%12||12)+":"+(m<10?"0":"")+m+" "+(h>=12?"PM":"AM");
}

function weekKey() { return "w"+weekOffset; }

function openModal(dayIndex) {
  activeDay = dayIndex;
  document.getElementById("modal-title").textContent = "Add entry — " + FULL_DAYS[dayIndex];
  document.getElementById("m-job").value = "A Timer";
  document.getElementById("m-start").value = "";
  document.getElementById("m-end").value = "";
  document.getElementById("m-notes").value = "";
  document.getElementById("m-custom").value = "";
  document.getElementById("m-err").textContent = "";
  document.getElementById("customWrap").style.display = "none";
  document.getElementById("modal-bg").classList.add("open");
}

function closeModal() { document.getElementById("modal-bg").classList.remove("open"); editingId = null; }

document.getElementById("modal-bg").addEventListener("click", function(ev) {
  if (ev.target === this) closeModal();
});

function toggleCustom() {
  document.getElementById("customWrap").style.display =
    document.getElementById("m-job").value === "Custom" ? "block" : "none";
}

function saveEntry() {
  var start = document.getElementById("m-start").value;
  var end = document.getElementById("m-end").value;
  var err = document.getElementById("m-err");
  if (!start || !end) { err.textContent = "Please enter both start and end time."; return; }
  var sm=toMins(start), em=toMins(end);
  if (em<=sm) em+=1440;
  var hours=(em-sm)/60;
  if (hours<=0) { err.textContent = "End must be after start."; return; }
  var job = document.getElementById("m-job").value;
  var title = job==="Custom" ? (document.getElementById("m-custom").value||"Custom Job") : job;

  if (editingId !== null) {
    // Edit existing
    entries = entries.map(function(e) {
      if (e.id !== editingId) return e;
      return { id:e.id, dayIndex:e.dayIndex, weekOffset:e.weekOffset, job:job, title:title, start:start, end:end, hours:hours, notes:document.getElementById("m-notes").value.trim(), submitted:e.submitted };
    });
    editingId = null;
  } else {
    entries.push({
      id: Date.now(), dayIndex: activeDay, weekOffset: weekOffset,
      job: job, title: title, start: start, end: end, hours: hours,
      notes: document.getElementById("m-notes").value.trim(), submitted: false
    });
  }
  saveEntries();
  closeModal();
  render();
}

function toggle(id) {
  var e = entries.find(function(x){return x.id===id;});
  if (e) { e.submitted=!e.submitted; saveEntries(); render(); }
}

function del(id) {
  if (!confirm("Delete this entry?")) return;
  entries = entries.filter(function(x){return x.id!==id;});
  saveEntries();
  render();
}

function openEdit(id) {
  var e = entries.find(function(x){return x.id===id;});
  if (!e) return;
  editingId = id;
  activeDay = e.dayIndex;
  document.getElementById("modal-title").textContent = "Edit entry — " + FULL_DAYS[e.dayIndex];
  document.getElementById("m-job").value = e.job;
  document.getElementById("m-start").value = e.start;
  document.getElementById("m-end").value = e.end;
  document.getElementById("m-notes").value = e.notes;
  document.getElementById("m-custom").value = (e.job==="Custom" ? e.title : "");
  document.getElementById("m-err").textContent = "";
  document.getElementById("customWrap").style.display = e.job==="Custom" ? "block" : "none";
  document.getElementById("modal-bg").classList.add("open");
}

function submitWeek() {
  var key = weekKey();
  if (officeSubmitted[key]) {
    officeSubmitted[key] = false;
  } else {
    officeSubmitted[key] = true;
  }
  localStorage.setItem("brrm_office_submitted", JSON.stringify(officeSubmitted));
  render();
}

function render() {
  var dates = getWeekDates(weekOffset);
  document.getElementById("week-label").textContent = fmtDate(dates[0])+" – "+fmtDate(dates[6]);

  var weekEntries = entries.filter(function(e){ return e.weekOffset===weekOffset; });
  var total = weekEntries.reduce(function(s,e){return s+calcPay(e);},0);
  var totalHrs = weekEntries.reduce(function(s,e){return s+e.hours;},0);
  var offEntries = weekEntries.filter(function(e){return e.job==="Office Hours";});
  var offHrs = offEntries.reduce(function(s,e){return s+e.hours;},0);
  var offPay = offHrs * getRate("Office Hours");

  document.getElementById("hdr-stats").innerHTML =
    'Weekly pay: <strong>$'+total.toFixed(2)+'</strong> · Office hrs: <strong>'+offHrs.toFixed(2)+'</strong> · Entries: <strong>'+weekEntries.length+'</strong>';
  document.getElementById("s-pay").textContent = "$"+total.toFixed(2);
  document.getElementById("s-hrs").textContent = totalHrs.toFixed(2)+"h";
  document.getElementById("s-off").textContent = offHrs.toFixed(2)+"h";
  document.getElementById("s-count").textContent = weekEntries.length;

  // Office submit bar
  document.getElementById("office-summary-text").innerHTML =
    'Office hours this week: <strong>'+offHrs.toFixed(2)+' hrs</strong> · Pay: <strong>$'+offPay.toFixed(2)+'</strong>';
  var offBtn = document.getElementById("office-btn");
  if (officeSubmitted[weekKey()]) {
    offBtn.textContent = "✓ Submitted";
    offBtn.className = "btn-submit-week done";
    offBtn.onclick = null;
  } else {
    offBtn.textContent = "Submit Office Hours";
    offBtn.className = "btn-submit-week";
    offBtn.onclick = submitWeek;
  }

  // Calendar
  var cal = document.getElementById("cal");
  cal.innerHTML = "";
  for (var i=0; i<7; i++) {
    var col = document.createElement("div");
    col.className = "cal-col";

    var hdr = document.createElement("div");
    hdr.className = "cal-day-hdr"+(isToday(dates[i])?" today":"");
    hdr.innerHTML = '<div class="cal-day-name">'+DAYS[i]+'</div><div class="cal-day-date">'+dates[i].getDate()+'</div>';
    col.appendChild(hdr);

    var body = document.createElement("div");
    body.className = "cal-entries";

    var dayEntries = weekEntries.filter(function(e){ return e.dayIndex===i; });
    dayEntries.forEach(function(e) {
      var chip = document.createElement("div");
      chip.className = "entry-chip "+(CHIP[e.job]||"chip-C");

      var chk = document.createElement("input");
      chk.type = "checkbox"; chk.className = "chip-check"; chk.checked = e.submitted; chk.title = "Mark submitted";
      chk.addEventListener("change", (function(eid){ return function(){ toggle(eid); }; })(e.id));
      chip.appendChild(chk);

      var t = document.createElement("div"); t.className = "chip-title"; t.textContent = e.title; chip.appendChild(t);
      var tm = document.createElement("div"); tm.className = "chip-time"; tm.textContent = fmt(e.start)+" – "+fmt(e.end); chip.appendChild(tm);
      var p = document.createElement("div"); p.className = "chip-pay"; p.textContent = "$"+calcPay(e).toFixed(2)+" · "+e.hours.toFixed(2)+"h"; chip.appendChild(p);
      if (e.notes) { var n = document.createElement("div"); n.style.cssText="font-size:10px;color:#777;margin-top:2px;"; n.textContent=e.notes; chip.appendChild(n); }

      var actions = document.createElement("div"); actions.className = "chip-actions";
      var editBtn = document.createElement("button"); editBtn.className = "chip-edit"; editBtn.textContent = "✎"; editBtn.title = "Edit";
      editBtn.addEventListener("click", (function(eid){ return function(ev){ ev.stopPropagation(); openEdit(eid); }; })(e.id));
      var delBtn = document.createElement("button"); delBtn.className = "chip-del"; delBtn.textContent = "×"; delBtn.title = "Delete";
      delBtn.addEventListener("click", (function(eid){ return function(ev){ ev.stopPropagation(); del(eid); }; })(e.id));
      actions.appendChild(editBtn); actions.appendChild(delBtn); chip.appendChild(actions);

      body.appendChild(chip);
    });

    var addBtn = document.createElement("button");
    addBtn.className = "add-chip";
    addBtn.textContent = "+ add";
    (function(idx){ addBtn.onclick = function(){ openModal(idx); }; })(i);
    body.appendChild(addBtn);

    col.appendChild(body);
    cal.appendChild(col);
  }
}
</script>
</body>
</html>
